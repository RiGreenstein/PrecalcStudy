<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrecalcStudy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="index">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">PrecalcStudy</span>
      <button id="theme-toggle" class="icon-btn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <main class="home">
    <h1>Your tests</h1>
    <p class="muted">Pick a unit. Each topic has notes, an interactive explorer, practice problems with hidden answers, and a randomized quiz.</p>
    <div id="unit-list" class="unit-list"></div>
    <p class="muted small footnote">To add a unit, see <code>docs/ADDING_A_UNIT.md</code>.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="assets/js/math.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/graph.js"></script>
  <script src="assets/js/widgets.js"></script>
  <script src="assets/js/sketch.js"></script>
  <script src="assets/js/quiz.js"></script>
  <script src="units/registry.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
